name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dealwatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s
          --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/dealwatch_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply cleanly on PostgreSQL
        run: alembic upgrade head && alembic downgrade base
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Tests + coverage (fails under 80%)
        run: pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      PRICE_SOURCE: fake # no outside network calls in CI
      DEMO_SEED: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Start the whole stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: API answers through nginx
        run: |
          curl --fail --silent http://localhost:8080/api/health
          curl --fail --silent http://localhost:8080/api/watchlist | grep -q "Starfall Courier"
          curl --fail --silent http://localhost:8080/ | grep -q "<div id=\"root\">"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down --volumes
        if: always()
