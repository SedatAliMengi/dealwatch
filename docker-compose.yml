# One command starts everything:  docker compose up --build
#   Web page:  http://localhost:8080
#   API docs:  http://localhost:8000/docs
# Values come from .env if it exists (copy .env.example), else the defaults below.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dealwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dealwatch}
      POSTGRES_DB: ${POSTGRES_DB:-dealwatch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dealwatch} -d ${POSTGRES_DB:-dealwatch}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dealwatch}:${POSTGRES_PASSWORD:-dealwatch}@db:5432/${POSTGRES_DB:-dealwatch}
      PRICE_SOURCE: ${PRICE_SOURCE:-cheapshark}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      CHECK_INTERVAL_HOURS: ${CHECK_INTERVAL_HOURS:-6}
      RUN_CHECK_ON_STARTUP: ${RUN_CHECK_ON_STARTUP:-false}
      CHEAPSHARK_CACHE_SECONDS: ${CHEAPSHARK_CACHE_SECONDS:-600}
      CHEAPSHARK_MIN_INTERVAL_SECONDS: ${CHEAPSHARK_MIN_INTERVAL_SECONDS:-1}
      DEMO_SEED: ${DEMO_SEED:-false}
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata:
